# This workflow checks that /docs contains the required planning files (ERD, endpoint plan, SQL script) on every push.
name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "Error: /docs folder is missing."
            exit 1
          fi
          echo "/docs folder found."

      - name: Check required planning files exist
        run: |
          missing=0

          if ! ls docs/*.png >/dev/null 2>&1 && ! ls docs/*.pdf >/dev/null 2>&1; then
            echo "Error: ERD file (PNG or PDF) not found in /docs."
            missing=1
          fi

          if ! ls docs/endpoint-plan.* >/dev/null 2>&1; then
            echo "Error: endpoint plan file not found in /docs."
            missing=1
          fi

          if ! ls docs/*.sql >/dev/null 2>&1; then
            echo "Error: SQL script (.sql) not found in /docs."
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          echo "All required planning files are present."
